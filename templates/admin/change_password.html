{% extends 'admin/base.html' %}
{% block title %}ប្តូរពាក្យសម្ងាត់ - NITEANKH Admin{% endblock %}

{% block content %}
<main class="max-w-md mx-auto px-4 sm:px-6 py-8">
    <div class="mb-5">
        <h1 class="text-lg sm:text-xl font-bold text-white">ប្តូរពាក្យសម្ងាត់</h1>
        <p class="text-xs sm:text-sm text-zinc-500 mt-1">ប្តូរពាក្យសម្ងាត់សម្រាប់គណនីចូលប្រើផ្ទាំងគ្រប់គ្រងរបស់អ្នក</p>
    </div>

    <form method="post" class="bg-cardbg border border-zinc-800 rounded-xl p-5 sm:p-6 space-y-3.5">
        <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1.5">ពាក្យសម្ងាត់បច្ចុប្បន្ន</label>
            <input name="current_password" required type="password" placeholder="••••••••" class="w-full bg-zinc-900/90 text-sm text-gray-200 rounded-lg px-3.5 py-2.5 border border-zinc-700/80 focus:outline-none focus:border-gold transition-colors">
        </div>
        <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1.5">ពាក្យសម្ងាត់ថ្មី (យ៉ាងតិច ៦ តួ)</label>
            <input name="new_password" required minlength="6" type="password" placeholder="••••••••" class="w-full bg-zinc-900/90 text-sm text-gray-200 rounded-lg px-3.5 py-2.5 border border-zinc-700/80 focus:outline-none focus:border-gold transition-colors">
        </div>
        <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1.5">បញ្ជាក់ពាក្យសម្ងាត់ថ្មី</label>
            <input name="confirm_password" required minlength="6" type="password" placeholder="••••••••" class="w-full bg-zinc-900/90 text-sm text-gray-200 rounded-lg px-3.5 py-2.5 border border-zinc-700/80 focus:outline-none focus:border-gold transition-colors">
        </div>
        <button type="submit" class="w-full bg-gold hover:bg-gold-light text-black font-semibold text-sm py-2.5 rounded-lg transition">ប្តូរពាក្យសម្ងាត់</button>
    </form>
</main>
{% endblock %}
