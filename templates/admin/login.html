<!DOCTYPE html>
<html lang="km" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចូលប្រើ Admin - NITEANKH</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon-32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='images/favicon-16.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&family=Moul&display=swap">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { gold: { DEFAULT: '#C59B27', light: '#E2B842', dark: '#A37E1C' }, darkbg: '#0A0A0A', cardbg: '#141414' }, fontFamily: { sans: ['Kantumruy Pro', 'sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-darkbg text-gray-200 font-sans min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-sm">
        <div class="text-center mb-6">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="NITEANKH" class="inline-block w-14 h-14 rounded-full object-cover border border-gold/50 mb-3">
            <h1 class="text-lg font-bold text-white">NITEAN<span class="text-gold">KH</span> ADMIN</h1>
            <p class="text-xs text-zinc-500 mt-1">ផ្ទាំងគ្រប់គ្រងខ្លឹមសារ</p>
        </div>

        <div class="bg-cardbg border border-zinc-800 rounded-xl p-6">
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <p class="mb-3 text-xs font-medium text-center text-red-500">{{ messages[0] }}</p>
                {% endif %}
            {% endwith %}
            <form method="post" class="space-y-3.5">
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1.5">អ៊ីមែល</label>
                    <input name="email" required type="email" placeholder="admin@niteankh.local" class="w-full bg-zinc-900/90 text-sm text-gray-200 rounded-lg px-3.5 py-2.5 border border-zinc-700/80 focus:outline-none focus:border-gold transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1.5">ពាក្យសម្ងាត់</label>
                    <input name="password" required type="password" placeholder="••••••••" class="w-full bg-zinc-900/90 text-sm text-gray-200 rounded-lg px-3.5 py-2.5 border border-zinc-700/80 focus:outline-none focus:border-gold transition-colors">
                </div>
                <button type="submit" class="w-full bg-gold hover:bg-gold-light text-black font-semibold text-sm py-2.5 rounded-lg transition">ចូលប្រើ</button>
            </form>
            <p class="text-[11px] text-zinc-500 mt-4 text-center leading-relaxed">
                គណនីសាកល្បង៖ <span class="text-zinc-300">admin@niteankh.local</span> / <span class="text-zinc-300">admin123</span>
            </p>
        </div>

        <p class="text-center text-xs text-zinc-600 mt-5"><a href="{{ url_for('index') }}" class="hover:text-gold transition"><i class="fa-solid fa-arrow-left mr-1"></i> ត្រឡប់ទៅគេហទំព័រ</a></p>
    </div>
</body>
</html>
