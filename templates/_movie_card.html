<a href="{{ url_for('watch', movie_id=movie.id) }}" class="cursor-pointer group relative block rounded-lg overflow-hidden bg-lightcard dark:bg-cardbg border border-gray-200 dark:border-zinc-800 hover:border-gold/60 shadow-md transition">
    <div class="relative aspect-video w-full overflow-hidden bg-zinc-900">
        {% if movie.has_thumbnail %}
            <img src="{{ media_url('thumbnails', movie.thumbnail_filename) }}" class="absolute inset-0 w-full h-full object-cover" alt="">
        {% else %}
            <div class="absolute inset-0 flex items-center justify-center bg-gradient-to-r {{ movie.bg_grad }}">
                <span class="text-xs font-moul text-white px-2 text-center drop-shadow">{{ movie.title }}</span>
            </div>
        {% endif %}
        <span class="absolute bottom-1 left-1 bg-amber-500 text-black text-[8px] font-extrabold px-1.5 py-0.5 rounded shadow">{{ movie.quality }} ULTRA HD</span>
        {% if movie.vip %}
            <span class="absolute top-1 right-1 bg-gold text-black text-[8px] font-extrabold px-1.5 py-0.5 rounded shadow">VIP</span>
        {% endif %}
        {% if movie.is_new %}
            <span class="absolute top-1 left-1 bg-red-600 text-white text-[8px] font-extrabold px-1.5 py-0.5 rounded shadow">NEW</span>
        {% endif %}
    </div>
    <div class="p-2">
        <h3 class="text-xs font-bold text-gray-800 dark:text-gray-100 truncate">{{ movie.title }}</h3>
        <p class="text-[10px] text-gray-500 dark:text-zinc-400 mt-0.5">{{ movie.category }} &bull; {{ movie.total_episodes }} {{ t('common.episodes_unit') }}</p>
    </div>
</a>
